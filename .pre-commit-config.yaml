# Pre-commit hook: chặn commit nếu pylint fail (chạy đúng lệnh như CI).
# Cài 1 lần: pip install pre-commit && pre-commit install
# Commit từ terminal đã active .venv (cần lệnh `pylint` trên PATH).
repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint configs src scripts main.py
        language: system
        types: [python]
        pass_filenames: false
